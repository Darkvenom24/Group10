<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Keyboard Calculator</title>

    <style>
        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .calculator {
            width: 300px;
            padding: 20px;

            background-color: #222;
            border-radius: 15px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        /* Display */
        #display {
            width: 100%;
            height: 65px;

            box-sizing: border-box;

            margin-bottom: 15px;
            padding: 10px;

            border: none;
            border-radius: 8px;

            background-color: white;

            font-size: 28px;
            text-align: right;
        }

        /* Buttons */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;

            border: none;
            border-radius: 8px;

            background-color: #444;
            color: white;

            font-size: 20px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background-color: #666;
        }

        button:active {
            transform: scale(0.95);
        }

        /* Operators */
        .operator {
            background-color: orange;
        }

        .operator:hover {
            background-color: darkorange;
        }

        /* Clear */
        .clear {
            background-color: crimson;
        }

        .clear:hover {
            background-color: darkred;
        }

        /* Equal */
        .equal {
            background-color: green;
        }

        .equal:hover {
            background-color: darkgreen;
        }

        /* Hub Back Button */
        .hub-back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #222;
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
            z-index: 999;
        }

        .hub-back-btn:hover {
            background: #000000;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>
    <a href="index.html" class="hub-back-btn">← Back to Home Page</a>
    <a href="php-practicals.html" class="hub-back-btn" style="left: 200px; background: #FF9933; color: #000080; font-weight: bold;">⚡ PHP Practicals</a>

    <div class="calculator">

        <!-- Display -->
        <input type="text" id="display" readonly>

        <!-- Calculator Keyboard -->
        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="appendValue('(')">(</button>
            <button onclick="appendValue(')')">)</button>
            <button class="operator" onclick="appendValue('/')">÷</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('*')">×</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('-')">−</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>

        </div>

    </div>


    <script>

        // Display ko select karna
        const display = document.getElementById("display");


        // Calculator ke internal buttons se value add karna
        function appendValue(value) {

            // Agar display par Error hai to pehle clear karo
            if (display.value === "Error") {
                display.value = "";
            }

            display.value += value;
        }


        // Calculator clear karna
        function clearDisplay() {
            display.value = "";
        }


        // Last character delete karna
        function deleteLast() {
            display.value = display.value.slice(0, -1);
        }


        // Calculation
        function calculate() {

            if (display.value === "") {
                return;
            }

            try {

                let result = eval(display.value);

                display.value = result;

            } catch {

                display.value = "Error";

            }
        }


        function normalizeCalcKey(event) {
            const codeMap = {
                Numpad0: "0", Numpad1: "1", Numpad2: "2", Numpad3: "3", Numpad4: "4",
                Numpad5: "5", Numpad6: "6", Numpad7: "7", Numpad8: "8", Numpad9: "9",
                NumpadAdd: "+", NumpadSubtract: "-", NumpadMultiply: "*",
                NumpadDivide: "/", NumpadDecimal: ".", NumpadEnter: "Enter"
            };
            return codeMap[event.code] || event.key;
        }

        // =====================================
        // COMPUTER KEYBOARD & NUMPAD CONTROL
        // =====================================

        document.addEventListener("keydown", function(event) {
            if (event.ctrlKey || event.metaKey || event.altKey) return;

            let key = normalizeCalcKey(event);


            // Numbers
            if (key >= "0" && key <= "9") {
                event.preventDefault();
                appendValue(key);

            }


            // Decimal
            else if (key === ".") {
                event.preventDefault();
                appendValue(".");

            }


            // Addition
            else if (key === "+") {
                event.preventDefault();
                appendValue("+");

            }


            // Subtraction
            else if (key === "-") {
                event.preventDefault();
                appendValue("-");

            }


            // Multiplication
            else if (key === "*") {
                event.preventDefault();
                appendValue("*");

            }


            // Division
            else if (key === "/") {
                event.preventDefault();
                appendValue("/");

            }


            // Opening bracket
            else if (key === "(") {
                event.preventDefault();
                appendValue("(");

            }


            // Closing bracket
            else if (key === ")") {
                event.preventDefault();
                appendValue(")");

            }


            // Enter = Calculate
            else if (key === "Enter" || key === "=") {
                event.preventDefault();
                calculate();

            }


            // Backspace = Delete last character
            else if (key === "Backspace") {
                event.preventDefault();
                deleteLast();

            }


            // Escape, Delete, or C = Clear
            else if (key === "Escape" || key === "Delete" || key.toLowerCase() === "c") {
                event.preventDefault();
                clearDisplay();

            }

        });

    </script>

</body>

</html>
